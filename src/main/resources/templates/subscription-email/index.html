<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Offer</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #FAF8F4; color:#14213D; }
        .container{ max-width:620px; margin:24px auto; background:#fff; padding:24px; border-radius:10px; border:1px solid #E7E3DA }
        h1{ margin:0 0 12px }
        .details{ background:#F2EFE7; padding:12px; border-radius:8px }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${planName}">Plan Name</h1>

    <p>Hello <strong th:text="${contactName}">Administrator</strong>,</p>

    <p>
        Thanks for choosing Traavo. Below are the subscription details.
    </p>

    <div class="details">
        <p><strong>School:</strong> <span th:text="${schoolName}">School Name</span></p>
        <p><strong>Price:</strong> <span th:text="${price}">0</span> (<span th:text="${billingCycle}">MONTHLY</span>)</p>
        <p><strong>Features:</strong></p>
        <ul>
            <li th:each="f : ${features}" th:text="${f}">Feature</li>
        </ul>
    </div>

    <p>Regards,<br/>Traavo Team</p>
</div>
</body>
</html>

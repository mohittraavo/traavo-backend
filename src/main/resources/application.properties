school.portal-url=${SCHOOL_PORTAL_URL:https://school.traavo.in}

# JWT configuration
jwt.secret=${JWT_SECRET:change-me-replace-with-secure-random-value}
jwt.expiration-ms=86400000

# Local H2 (application.properties overrides application.yml when both set the same keys)
spring.datasource.url=jdbc:h2:mem:tcms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
